name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/nextapp/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["frontend/nextapp/**", ".github/workflows/ci.yml"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nextapp
    env:
      NEXT_PUBLIC_API_URL: https://api.susieqsbooks.org
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ci-placeholder
      NEXT_PUBLIC_DONATION_AMOUNT_PER_BOOK: "10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/nextapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
